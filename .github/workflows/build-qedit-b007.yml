name: Build QEDIT B007 diagnostic
on:
  push:
    branches: [qedit-b007-save-isolation]
    paths: ['editor/**', '.github/workflows/build-qedit-b007.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and verify 16K ROM
        run: |
          set -euo pipefail
          cd editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT_V042_B007_DIAGNOSTIC.ROM
          test "$(stat -c%s QEDIT_V042_B007_DIAGNOSTIC.ROM)" -eq 16384
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-B007-NO-DISK-DIAGNOSTIC
          path: editor/QEDIT_V042_B007_DIAGNOSTIC.ROM
          if-no-files-found: error
