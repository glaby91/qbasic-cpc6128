name: Build QLIB MATH MATRIX v0.3
on:
  push:
    branches: [qlib-unified-v030-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and calculate actual occupied ROM bytes
        run: |
          set -euo pipefail
          cd qlib/unified
          /tmp/rasm-src/rasm.exe QLIB_UNIFIED_ROM.asm -ob QLIB_UNIFIED_V030_TEST.ROM
          test "$(stat -c%s QLIB_UNIFIED_V030_TEST.ROM)" -eq 16384
          python3 -c 'b=open("QLIB_UNIFIED_V030_TEST.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n,"ROM_BYTES",len(b))'
      - uses: actions/upload-artifact@v4
        with:
          name: QLIB-MATH-MATRIX-V030
          path: qlib/unified/QLIB_UNIFIED_V030_TEST.ROM
          if-no-files-found: error
