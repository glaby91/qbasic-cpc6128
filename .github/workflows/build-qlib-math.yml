name: Build QLIB Math prototype
on:
  push:
    branches: [qlib-math-0.1]
    paths:
      - 'qlib/math/**'
      - 'tests/math/**'
      - '.github/workflows/build-qlib-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reference arithmetic tests
        run: python3 tests/math/reference_tests.py
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble ROM and check size
        run: |
          set -euo pipefail
          cd qlib/math
          /tmp/rasm-src/rasm.exe QLIB_MATH_ROM.asm -ob QLIB_MATH_V001.ROM
          test "$(stat -c%s QLIB_MATH_V001.ROM)" -eq 16384
          python3 -c 'b=open("QLIB_MATH_V001.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n)'
      - uses: actions/upload-artifact@v4
        with:
          name: QLIB-MATH-v0.1-PROTOTYPE
          path: qlib/math/QLIB_MATH_V001.ROM
          if-no-files-found: error
