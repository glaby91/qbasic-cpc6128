name: Build QLIB MATH BASIC selftest
on:
  push:
    branches: [qlib-math-rom-test]
    paths:
      - 'qlib/math/**'
      - 'tests/math/**'
      - '.github/workflows/build-qlib-math-rom-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and validate
        run: |
          set -euo pipefail
          cd qlib/math
          /tmp/rasm-src/rasm.exe QLIB_MATH_ROM.asm -ob QLIB_MATH_V012_TEST.ROM
          test "$(stat -c%s QLIB_MATH_V012_TEST.ROM)" -eq 16384
          python3 -c 'b=open("QLIB_MATH_V012_TEST.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n)'
      - uses: actions/upload-artifact@v4
        with:
          name: QLIB-MATH-V012-BASIC-SELFTEST
          path: |
            qlib/math/QLIB_MATH_V012_TEST.ROM
            tests/math/QLIB_MATH_TEST.BAS
          if-no-files-found: error
