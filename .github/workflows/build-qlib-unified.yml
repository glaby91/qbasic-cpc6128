name: Build unified QLIB MATH+MATRIX ROM
on:
  push:
    branches: [qlib-unified-math-0.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and check 16 KiB ROM
        run: |
          set -euo pipefail
          cd qlib/unified
          /tmp/rasm-src/rasm.exe QLIB_UNIFIED_ROM.asm -ob QLIB_UNIFIED_V021_TEST.ROM
          test "$(stat -c%s QLIB_UNIFIED_V021_TEST.ROM)" -eq 16384
          python3 -c 'b=open("QLIB_UNIFIED_V021_TEST.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n)'
      - uses: actions/upload-artifact@v4
        with:
          name: QLIB-MATH-MATRIX-V021
          path: |
            qlib/unified/QLIB_UNIFIED_V021_TEST.ROM
            tests/math/UNIFIED_MATH_TEST.BAS
          if-no-files-found: error
