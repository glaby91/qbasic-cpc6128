name: Build QLIB v0.4.1 benchmark
on:
  push:
    branches: [qlib-v041-benchmark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - run: |
          set -euo pipefail
          cd qlib/unified
          /tmp/rasm-src/rasm.exe QLIB_UNIFIED_ROM.asm -ob QLIB_UNIFIED_V041_BENCH.ROM
          test "$(stat -c%s QLIB_UNIFIED_V041_BENCH.ROM)" -eq 16384
          python3 -c 'b=open("QLIB_UNIFIED_V041_BENCH.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n)'
      - uses: actions/upload-artifact@v4
        with:
          name: QLIB-v041-BASIC-benchmark
          path: |
            qlib/unified/QLIB_UNIFIED_V041_BENCH.ROM
            tests/benchmarks/QLIB_VS_BASIC.BAS
          if-no-files-found: error
